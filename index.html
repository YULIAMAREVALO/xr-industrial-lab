<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio XR - Selector de Modelos</title>
  
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  
  <style>
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: rgba(15, 23, 42, 0.9);
      padding: 18px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      min-width: 220px;
    }

    .ui-title {
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
      text-align: center;
    }

    /* Selector desplegable */
    .select-xr {
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #3b82f6;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      width: 100%;
    }

    .select-xr:hover {
      border-color: #60a5fa;
    }

    /* Botones rápidos */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-xr {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      text-align: center;
    }

    .btn-xr:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
    }

    .btn-xr.active {
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
    }

    .btn-all {
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      grid-column: span 2;
    }

    .btn-vr {
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="ui-title">Seleccionar Modelo</div>
    
    <select id="selector-modelo" class="select-xr" onchange="cambiarDesdeSelector(this.value)">
      <option value="primitivas">1. Primitivas Básicas</option>
      <option value="banda">2. Banda Transportadora</option>
      <option value="cad">3. Laminadoras CAD</option>
      <option value="todo">4. Ver Todo Junto</option>
    </select>

    <div class="btn-grid">
      <button id="btn-primitivas" class="btn-xr active" onclick="mostrarPaso('primitivas')">Primitivas</button>
      <button id="btn-banda" class="btn-xr" onclick="mostrarPaso('banda')">Banda</button>
      <button id="btn-cad" class="btn-xr" onclick="mostrarPaso('cad')">Laminadoras</button>
      <button id="btn-todo" class="btn-xr btn-all" onclick="mostrarPaso('todo')">Ver Todo Junto 🌐</button>
      <button class="btn-xr btn-vr" onclick="entrarVR()">🥽 Modo VR</button>
    </div>
  </div>

  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <a-asset-item id="laminadorasCAD" src="models/laminadoras.glb"></a-asset-item>
    </a-assets>

    <a-plane rotation="-90 0 0" width="60" height="60" color="#1e293b"></a-plane>
    <a-sky color="#38bdf8"></a-sky>
    
    <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
    <a-light type="directional" position="2 8 4" intensity="1.8"></a-light>
    <a-light type="directional" position="-4 5 -2" intensity="1.0" color="#e0f2fe"></a-light>

    <a-entity id="grupo-primitivas" position="0 0 0" visible="true">
      <a-box position="0 1 -3" rotation="0 45 0" color="#0284c7"></a-box>
      <a-sphere position="2 1 -4" radius="1" color="#e11d48"></a-sphere>
      <a-cylinder position="-2 1 -4" radius="0.5" height="1.5" color="#d97706"></a-cylinder>
    </a-entity>

    <a-entity id="grupo-banda" position="0 0 0" visible="false">
      <a-box position="0 0.5 -3" width="1.2" height="0.4" depth="5" color="#475569"></a-box>
      <a-cylinder position="0 0.5 -0.5" rotation="0 0 90" radius="0.25" height="1.1" color="#0f172a"></a-cylinder>
      <a-cylinder position="0 0.5 -5.5" rotation="0 0 90" radius="0.25" height="1.1" color="#0f172a"></a-cylinder>
      <a-cylinder position="-0.5 0.25 -1.5" radius="0.05" height="0.5" color="#334155"></a-cylinder>
      <a-cylinder position="0.5 0.25 -1.5" radius="0.05" height="0.5" color="#334155"></a-cylinder>
      <a-box position="0 0.9 -2.5" width="0.6" height="0.4" depth="0.6" color="#b45309"></a-box>
      <a-cylinder position="-0.8 1 -3" radius="0.03" height="1.2" color="#94a3b8"></a-cylinder>
      <a-sphere position="-0.8 1.6 -3" radius="0.1" color="#16a34a"></a-sphere>
    </a-entity>

    <a-entity id="grupo-cad" position="0 0 0" visible="false">
      <a-entity 
        gltf-model="#laminadorasCAD" 
        position="0 0.5 -3" 
        rotation="90 0 0" 
        scale="0.0025 0.0025 0.0025">
      </a-entity>
    </a-entity>

    <a-entity id="rig" position="0 1.6 3">
      <a-camera look-controls wasd-controls="acceleration: 15"></a-camera>
    </a-entity>
  </a-scene>

  <script>
    function cambiarDesdeSelector(valor) {
      mostrarPaso(valor);
    }

    function mostrarPaso(paso) {
      const gPrimitivas = document.getElementById('grupo-primitivas');
      const gBanda = document.getElementById('grupo-banda');
      const gCad = document.getElementById('grupo-cad');

      // Actualizar el valor del desplegable
      document.getElementById('selector-modelo').value = paso;

      // Remover estado activo de botones
      const botones = ['btn-primitivas', 'btn-banda', 'btn-cad', 'btn-todo'];
      botones.forEach(b => document.getElementById(b).classList.remove('active'));

      if (paso === 'primitivas') {
        gPrimitivas.setAttribute('visible', 'true');
        gPrimitivas.setAttribute('position', '0 0 0');
        gBanda.setAttribute('visible', 'false');
        gCad.setAttribute('visible', 'false');
        document.getElementById('btn-primitivas').classList.add('active');

      } else if (paso === 'banda') {
        gPrimitivas.setAttribute('visible', 'false');
        gBanda.setAttribute('visible', 'true');
        gBanda.setAttribute('position', '0 0 0');
        gCad.setAttribute('visible', 'false');
        document.getElementById('btn-banda').classList.add('active');

      } else if (paso === 'cad') {
        gPrimitivas.setAttribute('visible', 'false');
        gBanda.setAttribute('visible', 'false');
        gCad.setAttribute('visible', 'true');
        gCad.setAttribute('position', '0 0 0');
        document.getElementById('btn-cad').classList.add('active');

      } else if (paso === 'todo') {
        // Distribución ordenada frente al usuario
        gPrimitivas.setAttribute('visible', 'true');
        gPrimitivas.setAttribute('position', '-3.5 0 0');

        gBanda.setAttribute('visible', 'true');
        gBanda.setAttribute('position', '0 0 0');

        gCad.setAttribute('visible', 'true');
        gCad.setAttribute('position', '3.5 0 0');

        document.getElementById('btn-todo').classList.add('active');
      }
    }

    function entrarVR() {
      var scene = document.querySelector('a-scene');
      if (scene.is('vr-mode')) {
        scene.exitVR();
      } else {
        scene.enterVR();
      }
    }
  </script>
</body>
</html>
