<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio XR - Control Multiplataforma</title>
  
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  
  <style>
    /* Panel Flotante con Selector */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: rgba(15, 23, 42, 0.9);
      padding: 16px 20px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      min-width: 220px;
    }

    .ui-label {
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Estilo del Selector Desplegable */
    .xr-select {
      background-color: #1e293b;
      color: #ffffff;
      border: 2px solid #3b82f6;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .xr-select:hover {
      border-color: #60a5fa;
      background-color: #334155;
    }

    /* Botón VR */
    .btn-vr {
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      color: white;
      border: none;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
      transition: all 0.2s ease;
    }

    .btn-vr:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(236, 72, 153, 0.5);
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <label class="ui-label" for="selector-escena">Seleccionar Elemento:</label>
    <select id="selector-escena" class="xr-select" onchange="cambiarEscena(this.value)">
      <option value="primitivas">1. Primitivas Básicas</option>
      <option value="banda">2. Banda Transportadora</option>
      <option value="cad">3. Laminadoras CAD</option>
      <option value="todo">4. Ver Todo Junto</option>
    </select>

    <button class="btn-vr" onclick="entrarVR()">🥽 Modo VR Inmersivo</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <a-asset-item id="laminadorasCAD" src="models/laminadoras.glb"></a-asset-item>
    </a-assets>

    <a-plane rotation="-90 0 0" width="60" height="60" color="#1e293b"></a-plane>
    <a-sky color="#38bdf8"></a-sky>
    
    <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
    <a-light type="directional" position
