<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laboratorio XR - Laminadoras Industriales</title>
  <!-- Librería principal de A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  <!-- Librería de controles y visualización extra -->
  <script src="https://cdn.jsdelivr.net/cdn.aframe-extras/6.1.1/aframe-extras.min.js"></script>
</head>
<body>
  <a-scene library>
    <a-assets>
      <a-asset-item id="laminadorasCAD" src="models/laminadoras.glb"></a-asset-item>
    </a-assets>

    <!-- ENTORNO E ILUMINACIÓN -->
    <a-plane rotation="-90 0 0" width="100" height="100" color="#333333"></a-plane>
    <a-sky color="#87CEEB"></a-sky>
    
    <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
    <a-light type="directional" position="1 4 2" intensity="1.0"></a-light>

    <!-- CAMARA CON CÁLCULO AUTOMÁTICO -->
    <a-entity id="rig" position="0 1.6 5">
      <a-camera look-controls wasd-controls="fly: true; acceleration: 20"></a-camera>
    </a-entity>

    <!-- LAMINADORA CON ESCALA NORMALIZADA -->
    <a-entity 
      gltf-model="#laminadorasCAD" 
      position="0 0 -2" 
      scale="0.01 0.01 0.01">
    </a-entity>
  </a-scene>
</body>
</html>
